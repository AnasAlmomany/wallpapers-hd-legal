<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wallpapers HD — 4K Themes</title>
<style>
:root{--bg:#0b0b0d;--card:#141417;--line:#26262b;--gold:#deb259;--txt:#f4f4f6;--dim:#a0a0a8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:0 auto;padding:48px 22px 80px}
.hero{text-align:center;padding:40px 0 24px}
.crown{width:84px;height:84px;border-radius:22px;display:inline-flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 30%,rgba(222,178,89,.28),transparent 70%);border:1px solid rgba(222,178,89,.5);font-size:40px;margin-bottom:18px}
h1{font-size:30px;margin:0 0 6px;letter-spacing:-.02em}
.sub{color:var(--dim);margin:0 0 4px}
.cards{display:grid;gap:14px;margin-top:34px}
a.card{display:flex;align-items:center;gap:14px;text-decoration:none;color:var(--txt);background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px;transition:border-color .2s,transform .1s}
a.card:hover{border-color:rgba(222,178,89,.55);transform:translateY(-1px)}
a.card .ic{font-size:22px;width:30px;text-align:center}
a.card .t{font-weight:600}
a.card .d{color:var(--dim);font-size:13px}
a.card .arrow{margin-left:auto;color:var(--gold)}
footer{margin-top:48px;text-align:center;color:var(--dim);font-size:13px}
footer a{color:var(--gold);text-decoration:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <div class="crown">👑</div>
    <h1>Wallpapers HD: 4K Themes</h1>
    <p class="sub">100,000+ stunning 4K &amp; live wallpapers, fresh every day.</p>
  </div>
  <div class="cards">
    <a class="card" href="privacy.html"><span class="ic">🔒</span><span><span class="t">Privacy Policy</span><br><span class="d">What we collect and how it's used</span></span><span class="arrow">→</span></a>
    <a class="card" href="terms.html"><span class="ic">📜</span><span><span class="t">Terms &amp; Conditions</span><br><span class="d">Terms of use and license (EULA)</span></span><span class="arrow">→</span></a>
    <a class="card" href="support.html"><span class="ic">✉️</span><span><span class="t">Support</span><br><span class="d">Get help or send feedback</span></span><span class="arrow">→</span></a>
  </div>
  <footer>© 2026 Hydra · Wallpapers HD · <a href="mailto:anas.almomany@outlook.com">anas.almomany@outlook.com</a></footer>
</div>
</body>
</html>
